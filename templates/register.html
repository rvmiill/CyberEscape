{% extends 'base.html' %}

{% block title %}CyberEscape | Register{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="scan-lines"></div>
    <div class="floating-particles"></div>

    <div class="auth-card">
        <h1 class="auth-main-title">
            <span class="green-glow">CREATE</span> <span class="blue-glow">ACCOUNT</span>
        </h1>

        <p class="auth-sub">
            Register and begin your cybersecurity learning journey.
        </p>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <form method="POST" class="auth-form">
            <div class="input-box">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="registerPassword" placeholder="Enter your password" required>
                    <span class="toggle-password" onclick="togglePassword('registerPassword', this)">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>
                </div>
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm your password" required>
                    <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="auth-btn">REGISTER</button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</section>
{% endblock %}
